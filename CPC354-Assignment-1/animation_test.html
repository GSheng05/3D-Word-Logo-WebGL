<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D Word Logo Animation</title>
<!--
    Draws the real word from src/geometry and moves it with src/animation,
    using the team's camera and projection from src/graphics.
-->
<style>
    body   { background: #111; color: #eee; font: 14px Arial, sans-serif; }
    canvas { display: block; margin-bottom: 8px; }
    small  { color: #999; }
</style>

<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec3 vPosition;
attribute vec4 vColor;
varying vec4 fColor;

uniform mat4 modelViewMatrix;
uniform mat4 projectionMatrix;

void main()
{
    fColor = vColor;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(vPosition, 1.0);
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float;
varying vec4 fColor;

void main()
{
    gl_FragColor = fColor;
}
</script>

<script src="Common/MV.js"></script>
<script src="Common/initShaders.js"></script>
<script src="src/geometry/font.js"></script>
<script src="src/geometry/cube.js"></script>
<script src="src/geometry/word.js"></script>
<script src="src/graphics/camera.js"></script>
<script src="src/graphics/projection.js"></script>
<script src="src/animation/phases.js"></script>
<script src="src/animation/animation.js"></script>
<script src="src/animation/animationControls.js"></script>
</head>
<body>
<canvas id="gl-canvas" width="800" height="450"></canvas>

<div>
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="resetBtn">Reset</button>
</div>
<div>
    <label for="speedSlider">Speed</label>
    <input id="speedSlider" type="range" min="15" max="240" step="15" value="60">
    <span id="speedValue"></span>
</div>
<div>Phase: <span id="phaseLabel"></span></div>
<small>Space = start/pause &nbsp; R = reset &nbsp; +/- = speed</small>

<script>
var WORD = "USM";
var FILL = 0.72;  // the enlarged word fills 72% of the canvas, leaving room for the hover

var gl, canvas, mesh;
var fitScale;     // shrinks the word (17 units wide) to fit the camera's view
var modelViewMatrixLoc, projectionMatrixLoc;

// One colour per face, in the order of faceIds in cube.js.
var faceColors = [
    vec4(0.25, 0.50, 1.00, 1.0),   // 0 front
    vec4(1.00, 0.55, 0.15, 1.0),   // 1 back
    vec4(0.55, 0.72, 1.00, 1.0),   // 2 top
    vec4(0.10, 0.22, 0.55, 1.0),   // 3 bottom
    vec4(0.16, 0.34, 0.75, 1.0),   // 4 right
    vec4(0.16, 0.34, 0.75, 1.0)    // 5 left
];

// Every vertex takes the colour of the face it belongs to.
function makeColors() {
    var colors = [];
    for (var i = 0; i < mesh.faceIds.length; i++) {
        colors.push(faceColors[mesh.faceIds[i]]);
    }
    return colors;
}

// Finds the size that makes the enlarged word fill the canvas. The word is
// drawn smaller than that at the start, so maxScale brings it up to full size.
function computeFitScale() {
    var viewHeight = 2 * CAMERA_EYE[2] * Math.tan(radians(PROJ_FOVY) / 2);
    var viewWidth  = viewHeight * canvas.width / canvas.height;

    var fullScale = FILL * Math.min(viewWidth / mesh.bounds.size[0],
                                    viewHeight / mesh.bounds.size[1]);
    return fullScale / maxScale;
}

function drawLogo() {
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    var modelMatrix      = mult(getAnimationModelMatrix(), scale(fitScale, fitScale, fitScale));
    var modelViewMatrix  = mult(getViewMatrix(), modelMatrix);
    var projectionMatrix = getProjectionMatrix(canvas.width / canvas.height);

    gl.uniformMatrix4fv(modelViewMatrixLoc, false, flatten(modelViewMatrix));
    gl.uniformMatrix4fv(projectionMatrixLoc, false, flatten(projectionMatrix));

    gl.drawElements(gl.TRIANGLES, mesh.indices.length, gl.UNSIGNED_SHORT, 0);
}

window.onload = function init() {
    canvas = document.getElementById("gl-canvas");
    gl = canvas.getContext("webgl");
    if (!gl) { alert("WebGL isn't available"); return; }

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.07, 0.07, 0.07, 1.0);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);   // don't draw faces pointing away from the camera

    var program = initShaders(gl, "vertex-shader", "fragment-shader");
    gl.useProgram(program);

    mesh = buildWordGeometry({ word: WORD });
    fitScale = computeFitScale();

    var cBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, cBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, flatten(makeColors()), gl.STATIC_DRAW);

    var vColor = gl.getAttribLocation(program, "vColor");
    gl.vertexAttribPointer(vColor, 4, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(vColor);

    var vBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.positions, gl.STATIC_DRAW);

    var vPosition = gl.getAttribLocation(program, "vPosition");
    gl.vertexAttribPointer(vPosition, 3, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(vPosition);

    var iBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, iBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.indices, gl.STATIC_DRAW);

    modelViewMatrixLoc  = gl.getUniformLocation(program, "modelViewMatrix");
    projectionMatrixLoc = gl.getUniformLocation(program, "projectionMatrix");

    setRenderCallback(drawLogo);
    initAnimationControls();
    drawLogo();
};
</script>
</body>
</html>
