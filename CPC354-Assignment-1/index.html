<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Word Logo – CPC354 Assignment 1</title>
<link rel="stylesheet" href="styles/style.css">

<!--
    M2 (Phing Hong): put the shader code here, as two script tags:
        <script id="vertex-shader"   type="x-shader/x-vertex">   ... </script>
        <script id="fragment-shader" type="x-shader/x-fragment"> ... </script>
    Then load them with initShaders(gl, "vertex-shader", "fragment-shader").
    Until then, src/dev/placeholders.js uses its own temporary shader.
-->
</head>
<body>

<!-- The 3D logo is drawn here. It fills the whole window. -->
<canvas id="glCanvas"></canvas>

<!-- Control panel. <details> lets the user fold it away without any JavaScript. -->
<details id="panel" open>
    <summary>Controls</summary>

    <section>
        <h2>Animation</h2>
        <div class="row">
            <button id="startBtn">Start</button>
            <button id="stopBtn">Stop</button>
            <button id="resetBtn">Reset</button>
        </div>
        <label class="row" for="speedSlider">
            <span>Speed</span>
            <input id="speedSlider" type="range" min="15" max="180" step="15" value="60">
            <output id="speedValue">1.00×</output>
        </label>
        <p class="row">Phase: <span id="phaseLabel">Ready</span></p>
    </section>

    <section>
        <h2>Logo</h2>
        <label class="row" for="wordInput">
            <span>Word</span>
            <input id="wordInput" type="text" value="LOGO" maxlength="4" autocomplete="off" spellcheck="false">
        </label>
        <label class="row" for="depthSlider">
            <span>Depth</span>
            <input id="depthSlider" type="range" min="0.1" max="1.5" step="0.05" value="0.5">
            <output id="depthValue">0.50</output>
        </label>
    </section>

    <section>
        <h2>Colour</h2>
        <label class="row" for="colorMode">
            <span>Mode</span>
            <select id="colorMode">
                <option value="single">Single colour</option>
                <option value="frontSide" selected>Front + side</option>
                <option value="perLetter">Per letter</option>
            </select>
        </label>
        <label class="row" for="colorFront">
            <span>Front</span>
            <input id="colorFront" type="color" value="#ffcc33">
        </label>
        <label class="row" for="colorSide">
            <span>Side</span>
            <input id="colorSide" type="color" value="#7a3fb0">
        </label>
    </section>

    <p class="hint">Keys: Space = start / pause · R = reset · + / − = speed</p>
    <p id="placeholderBadge">Checking placeholders…</p>
</details>

<!--
    Scripts load in this order. No ES modules (they fail when the page is
    opened by double-click). Every file defines plain global functions.
    Add your new file inside YOUR OWN block only.
-->

<!-- Angel's library (do not edit, see Common/SOURCE.md) -->
<script src="Common/MV.js"></script>
<script src="Common/initShaders.js"></script>

<!-- M3 Yong Zhou: camera and matrices -->
<script src="src/graphics/transforms.js"></script>
<script src="src/graphics/camera.js"></script>
<script src="src/graphics/projection.js"></script>
<script src="src/graphics/resize.js"></script>

<!-- M1 Jason: 3D geometry -->
<script src="src/geometry/font.js"></script>
<script src="src/geometry/extrude.js"></script>
<script src="src/geometry/word.js"></script>

<!-- M5 Chun Shang: interaction and colour -->
<script src="src/ui/controls.js"></script>
<script src="src/ui/events.js"></script>
<script src="src/ui/colors.js"></script>

<!-- M4 Jeffry: animation -->
<script src="src/animation/phases.js"></script>
<script src="src/animation/animation.js"></script>
<script src="src/animation/animationControls.js"></script>

<!-- M2 Phing Hong: rendering and lighting -->
<script src="src/rendering/webgl.js"></script>
<script src="src/rendering/buffers.js"></script>
<script src="src/rendering/shaders.js"></script>
<script src="src/rendering/lighting.js"></script>

<!-- TEMPORARY: fills in any contract function nobody has written yet -->
<script src="src/dev/placeholders.js"></script>

<!-- M3 Yong Zhou: start-up and glue -->
<script src="src/main.js"></script>

</body>
</html>
