<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Animation Test</title>
<!--
    Test page for src/animation/: draws a coloured cube instead of the word logo.

    Face colours:  front = red, back = cyan, right = green,
                   left = magenta, top = yellow, bottom = blue
    "Rotate right" should swing the red face towards the green side.
-->
<style>
    body   { background: #111; color: #eee; font: 14px Arial, sans-serif; }
    canvas { display: block; margin-bottom: 8px; }
    small  { color: #999; }
</style>

<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec4 vPosition;
attribute vec4 vColor;
varying vec4 fColor;

uniform mat4 modelViewMatrix;
uniform mat4 projectionMatrix;

void main()
{
    fColor = vColor;
    gl_Position = projectionMatrix * modelViewMatrix * vPosition;
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float;
varying vec4 fColor;

void main()
{
    gl_FragColor = fColor;
}
</script>

<script src="../Common/MV.js"></script>
<script src="../Common/initShaders.js"></script>
<script src="../src/animation/phases.js"></script>
<script src="../src/animation/animation.js"></script>
<script src="../src/animation/animationControls.js"></script>
</head>
<body>
<canvas id="gl-canvas" width="640" height="480"></canvas>

<div>
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="resetBtn">Reset</button>
</div>
<div>
    <label for="speedSlider">Speed</label>
    <input id="speedSlider" type="range" min="15" max="240" step="15" value="60">
    <span id="speedValue"></span>
</div>
<div>Phase: <span id="phaseLabel"></span></div>
<small>Space = start/pause &nbsp; R = reset &nbsp; +/- = speed</small>

<script>
var gl, canvas;
var modelViewMatrixLoc, projectionMatrixLoc;

var points = [];
var colors = [];

var vertices = [
    vec4(-0.5, -0.5,  0.5, 1.0),   // 0-3 front (z+)
    vec4( 0.5, -0.5,  0.5, 1.0),
    vec4( 0.5,  0.5,  0.5, 1.0),
    vec4(-0.5,  0.5,  0.5, 1.0),
    vec4(-0.5, -0.5, -0.5, 1.0),   // 4-7 back (z-)
    vec4( 0.5, -0.5, -0.5, 1.0),
    vec4( 0.5,  0.5, -0.5, 1.0),
    vec4(-0.5,  0.5, -0.5, 1.0)
];

var eye = vec3(0.0, 0.0, 5.0);   // camera at z = 5
var at  = vec3(0.0, 0.0, 0.0);
var up  = vec3(0.0, 1.0, 0.0);

// Two triangles per face, all six vertices in the face colour.
function quad(a, b, c, d, color) {
    var indices = [a, b, c, a, c, d];
    for (var i = 0; i < indices.length; i++) {
        points.push(vertices[indices[i]]);
        colors.push(color);
    }
}

function colorCube() {
    quad(0, 1, 2, 3, vec4(0.90, 0.15, 0.15, 1.0));  // front
    quad(5, 4, 7, 6, vec4(0.15, 0.80, 0.85, 1.0));  // back
    quad(1, 5, 6, 2, vec4(0.20, 0.75, 0.25, 1.0));  // right
    quad(4, 0, 3, 7, vec4(0.80, 0.25, 0.80, 1.0));  // left
    quad(3, 2, 6, 7, vec4(0.95, 0.85, 0.20, 1.0));  // top
    quad(4, 5, 1, 0, vec4(0.20, 0.35, 0.90, 1.0));  // bottom
}

function render() {
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    var modelViewMatrix  = mult(lookAt(eye, at, up), getAnimationModelMatrix());
    var projectionMatrix = perspective(45, canvas.width / canvas.height, 0.1, 100);

    gl.uniformMatrix4fv(modelViewMatrixLoc, false, flatten(modelViewMatrix));
    gl.uniformMatrix4fv(projectionMatrixLoc, false, flatten(projectionMatrix));

    gl.drawArrays(gl.TRIANGLES, 0, points.length);
}

window.onload = function init() {
    canvas = document.getElementById("gl-canvas");
    gl = canvas.getContext("webgl");
    if (!gl) { alert("WebGL isn't available"); return; }

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.07, 0.07, 0.07, 1.0);
    gl.enable(gl.DEPTH_TEST);

    var program = initShaders(gl, "vertex-shader", "fragment-shader");
    gl.useProgram(program);

    colorCube();

    var cBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, cBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, flatten(colors), gl.STATIC_DRAW);

    var vColor = gl.getAttribLocation(program, "vColor");
    gl.vertexAttribPointer(vColor, 4, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(vColor);

    var vBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, flatten(points), gl.STATIC_DRAW);

    var vPosition = gl.getAttribLocation(program, "vPosition");
    gl.vertexAttribPointer(vPosition, 4, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(vPosition);

    modelViewMatrixLoc  = gl.getUniformLocation(program, "modelViewMatrix");
    projectionMatrixLoc = gl.getUniformLocation(program, "projectionMatrix");

    setRenderCallback(render);
    initAnimationControls();
    render();
};
</script>
</body>
</html>
